<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শিক্ষা সহায়ক - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #222;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h1, h2 {
      text-align: center;
      color: #1769aa;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #d32f2f;
    }

    .hidden {
      display: none;
    }

    .post {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .post h3 {
      margin-top: 0;
      color: #1769aa;
    }

    .delete {
      background: #d32f2f;
    }

    .edit {
      background: #ef8b00;
      margin-bottom: 5px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 5px;
    }

    #message {
      text-align: center;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h1>📚 শিক্ষা সহায়ক</h1>
    <h2>🔐 Admin Login</h2>

    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <p id="message"></p>
  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <h1>📚 Admin Dashboard</h1>

      <p>
        স্বাগতম, <b id="adminEmail"></b>
      </p>

      <button class="logout" id="logoutBtn">
        🚪 Logout
      </button>
    </div>


    <!-- ADD POST -->
    <div class="card">

      <h2>➕ নতুন পোস্ট যোগ করুন</h2>

      <label>Class</label>
      <select id="className">
        <option value="">Class নির্বাচন করুন</option>
        <option>Class 1</option>
        <option>Class 2</option>
        <option>Class 3</option>
        <option>Class 4</option>
        <option>Class 5</option>
        <option>Class 6</option>
        <option>Class 7</option>
        <option>Class 8</option>
        <option>Class 9</option>
        <option>Class 10</option>
        <option>Class 11</option>
        <option>Class 12</option>
      </select>


      <label>Subject</label>
      <input
        type="text"
        id="subject"
        placeholder="যেমন: বাংলা / ইংরেজি / গণিত"
      >


      <label>Chapter</label>
      <input
        type="text"
        id="chapter"
        placeholder="Chapter-এর নাম"
      >


      <label>Title</label>
      <input
        type="text"
        id="title"
        placeholder="পোস্টের শিরোনাম"
      >


      <label>Notes</label>
      <textarea
        id="notes"
        placeholder="এখানে শিক্ষামূলক নোট লিখুন..."
      ></textarea>


      <label>Q&A</label>
      <textarea
        id="qa"
        placeholder="প্রশ্ন ও উত্তর লিখুন..."
      ></textarea>


      <label>MCQ</label>
      <textarea
        id="mcq"
        placeholder="MCQ প্রশ্ন ও উত্তর লিখুন..."
      ></textarea>


      <label>PDF Link (যদি থাকে)</label>
      <input
        type="url"
        id="pdf"
        placeholder="PDF Link"
      >


      <button id="publishBtn">
        🚀 Publish Post
      </button>

      <p id="postMessage"></p>

    </div>


    <!-- POSTS -->
    <div class="card">

      <h2>📚 প্রকাশিত পোস্ট</h2>

      <div id="posts">
        পোস্ট লোড হচ্ছে...
      </div>

    </div>

  </div>

</div>


<script type="module">

  import { auth, db } from "./firebase.js";

  import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


  // =========================
  // ADMIN EMAIL
  // =========================

  const ADMIN_EMAIL = "sanfuisamiullah@gmail.com";


  // =========================
  // ELEMENTS
  // =========================

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");

  const email = document.getElementById("email");
  const password = document.getElementById("password");

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  const message = document.getElementById("message");
  const adminEmail = document.getElementById("adminEmail");

  const publishBtn = document.getElementById("publishBtn");
  const postMessage = document.getElementById("postMessage");

  const postsDiv = document.getElementById("posts");


  // =========================
  // LOGIN
  // =========================

  loginBtn.addEventListener("click", async () => {

    const userEmail = email.value.trim();
    const userPassword = password.value;

    if (!userEmail || !userPassword) {
      message.textContent = "Email এবং Password দিন।";
      return;
    }

    try {

      const result = await signInWithEmailAndPassword(
        auth,
        userEmail,
        userPassword
      );

      if (result.user.email !== ADMIN_EMAIL) {

        await signOut(auth);

        message.textContent =
          "❌ এই অ্যাকাউন্টের Admin access নেই।";

        return;
      }

      message.textContent = "Login সফল হয়েছে।";

    } catch (error) {

      message.textContent =
        "❌ Login ব্যর্থ: " + error.message;

    }

  });


  // =========================
  // AUTH STATE
  // =========================

  onAuthStateChanged(auth, async (user) => {

    if (user && user.email === ADMIN_EMAIL) {

      loginBox.classList.add("hidden");
      dashboard.classList.remove("hidden");

      adminEmail.textContent = user.email;

      loadPosts();

    } else {

      loginBox.classList.remove("hidden");
      dashboard.classList.add("hidden");

    }

  });


  // =========================
  // LOGOUT
  // =========================

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });


  // =========================
  // PUBLISH POST
  // =========================

  publishBtn.addEventListener("click", async () => {

    const className =
      document.getElementById("className").value;

    const subject =
      document.getElementById("subject").value.trim();

    const chapter =
      document.getElementById("chapter").value.trim();

    const title =
      document.getElementById("title").value.trim();

    const notes =
      document.getElementById("notes").value.trim();

    const qa =
      document.getElementById("qa").value.trim();

    const mcq =
      document.getElementById("mcq").value.trim();

    const pdf =
      document.getElementById("pdf").value.trim();


    if (!className || !subject || !title) {

      postMessage.textContent =
        "⚠️ Class, Subject এবং Title অবশ্যই দিতে হবে।";

      return;

    }


    try {

      await addDoc(
        collection(db, "posts"),
        {
          className: className,
          subject: subject,
          chapter: chapter,
          title: title,
          notes: notes,
          qa: qa,
          mcq: mcq,
          pdf: pdf,
          createdAt: serverTimestamp()
        }
      );


      postMessage.textContent =
        "✅ পোস্ট সফলভাবে Publish হয়েছে।";


      // FORM CLEAR

      document.getElementById("className").value = "";
      document.getElementById("subject").value = "";
      document.getElementById("chapter").value = "";
      document.getElementById("title").value = "";
      document.getElementById("notes").value = "";
      document.getElementById("qa").value = "";
      document.getElementById("mcq").value = "";
      document.getElementById("pdf").value = "";


      loadPosts();


    } catch (error) {

      postMessage.textContent =
        "❌ পোস্ট Publish করা যায়নি: " + error.message;

    }

  });


  // =========================
  // LOAD POSTS
  // =========================

  async function loadPosts() {

    postsDiv.innerHTML = "লোড হচ্ছে...";

    try {

      const snapshot =
        await getDocs(collection(db, "posts"));

      postsDiv.innerHTML = "";


      if (snapshot.empty) {

        postsDiv.innerHTML =
          "<p>এখনও কোনো পোস্ট নেই।</p>";

        return;

      }


      snapshot.forEach((item) => {

        const data = item.data();

        const post = document.createElement("div");

        post.className = "post";

        post.innerHTML = `

          <h3>${escapeHtml(data.title || "")}</h3>

          <p>
            <b>Class:</b>
            ${escapeHtml(data.className || "")}
          </p>

          <p>
            <b>Subject:</b>
            ${escapeHtml(data.subject || "")}
          </p>

          <p>
            <b>Chapter:</b>
            ${escapeHtml(data.chapter || "")}
          </p>

          <hr>

          <p>
            <b>Notes:</b><br>
            ${escapeHtml(data.notes || "").replace(/\n/g, "<br>")}
          </p>

          <p>
            <b>Q&A:</b><br>
            ${escapeHtml(data.qa || "").replace(/\n/g, "<br>")}
          </p>

          <p>
            <b>MCQ:</b><br>
            ${escapeHtml(data.mcq || "").replace(/\n/g, "<br>")}
          </p>

          ${
            data.pdf
              ? `<p><b>PDF:</b>
                 <a href="${escapeHtml(data.pdf)}"
                    target="_blank">
                    📄 PDF দেখুন
                 </a>
                 </p>`
              : ""
          }

          <button
            class="delete"
            data-id="${item.id}">
            🗑️ Delete
          </button>

        `;


        const deleteButton =
          post.querySelector(".delete");


        deleteButton.addEventListener(
          "click",
          async () => {

            const confirmDelete =
              confirm("এই পোস্টটি Delete করতে চান?");

            if (!confirmDelete) return;


            try {

              await deleteDoc(
                doc(db, "posts", item.id)
              );

              loadPosts();

            } catch (error) {

              alert(
                "Delete করা যায়নি: " +
                error.message
              );

            }

          }
        );


        postsDiv.appendChild(post);

      });


    } catch (error) {

      postsDiv.innerHTML =
        "❌ পোস্ট লোড করা যায়নি: " +
        error.message;

    }

  }


  // =========================
  // SECURITY
  // =========================

  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

</script>

</body>
</html>
